<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Palm Living demo — approved scope to factory, site and handover QA flow</title>
  <desc id="desc">Process diagram linking approved design and quotation to BOQ, purchase orders, factory work, inspection, dispatch, site installation, daily progress photos, snag resolution and client handover.</desc>
  <defs><style>.bg{fill:#f8f7f3}.paper{fill:#fff}.box{fill:#f1efea;stroke:#c7c1b6;stroke-width:2}.done{fill:#ddd6ca;stroke:#8d857a;stroke-width:2}.active{fill:#e6dac7;stroke:#aa8e65;stroke-width:2}.future{fill:#fff;stroke:#bcb7af;stroke-width:2}.line{stroke:#4b4945;stroke-width:3;fill:none;marker-end:url(#arrow)}.head{font:700 42px Arial,sans-serif;fill:#171717}.caps{font:700 17px Arial,sans-serif;letter-spacing:3px;fill:#5b5b58}.step{font:700 25px Arial,sans-serif;fill:#171717}.body{font:19px Arial,sans-serif;fill:#484743}.small{font:17px Arial,sans-serif;fill:#5b5b58}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#4b4945" stroke-width="2"/></marker></defs>
  <rect width="1600" height="1000" class="bg"/><rect x="36" y="36" width="1528" height="928" class="paper"/>
  <text x="76" y="104" class="caps">PALM LIVING · DEMO PROJECT CONTROL FLOW</text>
  <text x="76" y="165" class="head">From design intent to accepted handover</text>
  <text x="76" y="205" class="body">One connected project; each gate points to a document, task, quantity or photo record. Statuses below are workflow stages, not claims of live completion.</text>
  <line x1="76" y1="235" x2="1524" y2="235" stroke="#bcb7af" stroke-width="1.5"/>
  <path d="M455 375H570M955 375H1070M1280 455V548M1070 635H955M570 635H455M245 715V795M455 870H570M955 870H1070" class="line"/>
  <rect x="76" y="295" width="380" height="160" rx="10" class="done"/><text x="100" y="343" class="caps">01 · PRE-EXECUTION</text><text x="100" y="386" class="step">Requirements + design</text><text x="100" y="420" class="body">Rooms, item specs, concept image,</text><text x="100" y="444" class="body">coordinated drawing references</text>
  <rect x="570" y="295" width="386" height="160" rx="10" class="done"/><text x="594" y="343" class="caps">02 · COMMERCIAL</text><text x="594" y="386" class="step">Quotation + BOQ</text><text x="594" y="420" class="body">Accepted line items, quantities,</text><text x="594" y="444" class="body">rates and release evidence</text>
  <rect x="1070" y="295" width="454" height="160" rx="10" class="active"/><text x="1094" y="343" class="caps">03 · FACTORY PREPARATION</text><text x="1094" y="386" class="step">Materials + shop drawings</text><text x="1094" y="420" class="body">POs, reservations, drawings,</text><text x="1094" y="444" class="body">resource slot and quality hold points</text>
  <rect x="1070" y="548" width="454" height="166" rx="10" class="active"/><text x="1094" y="598" class="caps">04 · MANUFACTURE</text><text x="1094" y="640" class="step">Subtasks + inspection</text><text x="1094" y="675" class="body">Measured production progress;</text><text x="1094" y="699" class="body">photo evidence and QC actions</text>
  <rect x="570" y="548" width="386" height="166" rx="10" class="future"/><text x="594" y="598" class="caps">05 · LOGISTICS</text><text x="594" y="640" class="step">Dispatch + receipt</text><text x="594" y="675" class="body">Packing, destination, accepted</text><text x="594" y="699" class="body">and rejected quantities</text>
  <rect x="76" y="548" width="380" height="166" rx="10" class="future"/><text x="100" y="598" class="caps">06 · SITE EXECUTION</text><text x="100" y="640" class="step">Installation + daily log</text><text x="100" y="675" class="body">Area/task updates, labour,</text><text x="100" y="699" class="body">materials and real site photos</text>
  <rect x="76" y="795" width="380" height="150" rx="10" class="future"/><text x="100" y="840" class="caps">07 · QUALITY</text><text x="100" y="879" class="step">Snag + corrective action</text><text x="100" y="912" class="body">Owner, due date, before/after proof</text>
  <rect x="570" y="795" width="386" height="150" rx="10" class="future"/><text x="594" y="840" class="caps">08 · CLIENT REVIEW</text><text x="594" y="879" class="step">Walkthrough + acceptance</text><text x="594" y="912" class="body">Outstanding items and sign-off</text>
  <rect x="1070" y="795" width="454" height="150" rx="10" class="future"/><text x="1094" y="840" class="caps">09 · HANDOVER</text><text x="1094" y="879" class="step">As-builts + care pack</text><text x="1094" y="912" class="body">Approved documents and warranty</text>
  <text x="1370" y="224" class="small">SHEET 04 / 04</text>
</svg>
