# Shared routing for every Wodana host (included by wodana.conf); release header set by deploy.sh.
client_max_body_size 50M;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/json application/javascript application/manifest+json application/xml image/svg+xml;
add_header X-Wodana-Release $wodana_release always;

# Per-address limits from wodana.conf (only credential and public-form posts are counted); over the limit is 429.
limit_req zone=wodana_credentials burst=20 nodelay;
limit_req zone=wodana_public_forms burst=20 nodelay;
limit_req_status 429;
limit_req_log_level warn;

location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

# Bots probe for /.env, /.git and server scripts. None of these exist, so answer 404 here without waking the apps
# (the API's own paths are under ^~ /api/v1/ and never reach these rules).
location ~ /\.(?!well-known/) { access_log off; log_not_found off; return 404; }
location ~* (\.(php\d?|aspx?|jsp|cgi|env|ini|sql|bak|old|orig|swp|sh)$|^/(wp-admin|wp-includes|wp-content|cgi-bin|phpmyadmin|vendor/phpunit)(/|$)) {
    access_log off; log_not_found off; return 404;
}

# Service-to-service routes (internal token) are only for the web and the worker, which call 127.0.0.1 directly.
location ^~ /api/v1/internal/ { return 404; }
location ^~ /api/v1/integrations/google/internal/ { return 404; }
location ^~ /api/v1/integrations/providers/internal/ { return 404; }

location ^~ /api/v1/integrations/ {
    proxy_pass http://127.0.0.1:8001;
    include /etc/nginx/snippets/wodana-proxy.conf;
}

location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:8000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    # Set only by the web server when it calls the API itself (signature evidence, portal rate limits); a value
    # sent from outside is dropped.
    proxy_set_header X-Signer-Ip "";
    proxy_set_header X-Signer-Agent "";
    proxy_set_header X-Portal-Requester "";
}

location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Wodana-Release $wodana_release always;
}

# Optimised images keep the Cache-Control Next sets; landing and brand images are cached for a week.
location ^~ /_next/image {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    add_header X-Wodana-Release $wodana_release always;
}

# The landing's pre-generated screenshots carry a content hash in their names, so they never change: cache for a year.
location ^~ /landing/opt/ {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Wodana-Release $wodana_release always;
}

location ~* ^/(landing|brand)/.+\.(webp|avif|png|jpg|svg)$ {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Wodana-Release $wodana_release always;
}

# internal.<domain> opens the internal portal.
location = / {
    if ($host ~* ^internal\.) { return 302 /internal; }
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Wodana-Release $wodana_release always;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Wodana-Release $wodana_release always;
}
