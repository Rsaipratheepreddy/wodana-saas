# Palm Living's exact host is routed independently from the shared Wodana hosts.
# Replace the three __...__ values when staging a release.
server {
    listen 443 ssl;
    server_name plm.wodana.ai;
    ssl_certificate /etc/letsencrypt/live/wodana.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wodana.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 50M;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    add_header X-Wodana-Release "__RELEASE__" always;

    location ^~ /api/v1/integrations/ {
        proxy_pass http://127.0.0.1:18016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:__CORE_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Wodana-Release "__RELEASE__" always;
    }
}
