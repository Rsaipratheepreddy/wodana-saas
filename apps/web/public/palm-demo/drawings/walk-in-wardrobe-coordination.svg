<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Palm Living demo — walk-in wardrobe technical coordination</title>
  <desc id="desc">Not-to-scale elevation and section of a walk-in wardrobe, with MR plywood carcass, veneer or laminate finish, soft-close hinges, hanging, drawers, and installation checks. No unverified dimensions are shown.</desc>
  <defs><style>.bg{fill:#f8f7f3}.paper{fill:#fff}.ink{fill:#171717}.muted{fill:#555}.fine{stroke:#777771;stroke-width:1.5;fill:none}.line{stroke:#252525;stroke-width:3;fill:none}.dash{stroke:#777;stroke-width:2;stroke-dasharray:8 8;fill:none}.warm{fill:#ddd6ca}.oak{fill:#b6a28b}.soft{fill:#efede8}.label{font:600 24px Arial,sans-serif;fill:#171717}.note{font:20px Arial,sans-serif;fill:#4b4b48}.small{font:17px Arial,sans-serif;fill:#5b5b58}.head{font:700 42px Arial,sans-serif;fill:#171717}.caps{font:700 17px Arial,sans-serif;letter-spacing:3px;fill:#5b5b58}</style></defs>
