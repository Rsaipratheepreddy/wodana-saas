name: Wodana quality gates

on:
  pull_request:
  push:
    branches: [main, "release/**"]

jobs:
  web-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @wodana/web
      - run: npm test --workspace @wodana/web
      - run: npm run typecheck --workspace @wodana/business-core
      - run: npm test --workspace @wodana/business-core

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wodana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wodana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create the RLS-restricted application role
        run: psql "$DATABASE_URL" -c "CREATE ROLE wodana_app LOGIN PASSWORD 'wodana_app' NOBYPASSRLS"
      - name: Build the schema from the migration journal
        working-directory: services/business-core
        run: MIGRATION_DATABASE_URL="$DATABASE_URL" npx drizzle-kit migrate
      - name: Real-PostgreSQL repository, board and isolation tests
        working-directory: services/business-core
        run: PROJECT_REPOSITORY_TEST_DATABASE_URL="$DATABASE_URL" npx vitest run src/**/*.integration.spec.ts

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm test
        working-directory: apps/mobile
      - run: npx tsc --noEmit
        working-directory: apps/mobile

  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/intelligence-automation/pyproject.toml
      - run: pip install -e 'services/intelligence-automation[dev]'
      - run: ruff check services/intelligence-automation/src services/intelligence-automation/tests
      - run: mypy services/intelligence-automation/src
      - run: pytest -q services/intelligence-automation/tests

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./infra/hostinger/validate.sh infra/hostinger/env.production.example structure-only
