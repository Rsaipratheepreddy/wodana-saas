# Production on one AWS EC2 host (t4g.medium, arm64). Host nginx terminates TLS; every service binds
# to loopback. Images are built on the host by deploy.sh and tagged with RELEASE (from ./.env).
name: wodana-prod
x-logging: &logging {driver: json-file, options: {max-size: 10m, max-file: "3"}}
services:
  postgres:
    # 18, the same major version as UAT, so a database moves between them with pg_dump/pg_restore.
    image: postgres:18-alpine
    network_mode: host
    env_file: [./postgres.env]
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - max_connections=80
      - -c
      - log_min_duration_statement=1000
      # A leaked "idle in transaction" session holds its locks until it ends and would block the next migration.
      - -c
      - idle_in_transaction_session_timeout=600000
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./001-create-app-role.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis:
    image: redis:7-alpine
    network_mode: host
    command: [redis-server, --bind, 127.0.0.1, --port, "6379", --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      retries: 6
  migrate:
    image: wodana-core-migrator:${RELEASE:?Set RELEASE}
    network_mode: host
    env_file: [./migrate.env]
    restart: "no"
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
  business-core:
    image: wodana-core:${RELEASE}
    network_mode: host
    env_file: [./core.env]
    environment: {NODE_ENV: production, ENVIRONMENT: production, NODE_OPTIONS: --max-old-space-size=640, HOST: 127.0.0.1, PORT: "8000", WODANA_RELEASE_ID: "${RELEASE}"}
    volumes: [object_data:/app/.data]
    init: true
    restart: unless-stopped
    # Time for in-flight requests and the current sweep to finish after SIGTERM before the kill.
    stop_grace_period: 30s
    mem_limit: 896m
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 30s
      retries: 8
  intelligence-api:
    image: wodana-intelligence:${RELEASE}
    network_mode: host
    env_file: [./intelligence.env]
    command: [uvicorn, "wodana_intelligence.main:app", --host, 127.0.0.1, --port, "8001"]
    init: true
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    depends_on:
      business-core: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health/live')"]
      interval: 15s
      start_period: 20s
      retries: 8
  # Required: it delivers every email, WhatsApp and push and runs the SLA, takeover and reminder timers.
  intelligence-worker:
    image: wodana-intelligence:${RELEASE}
    network_mode: host
    env_file: [./intelligence.env]
    environment: {WORKER_CONSUMER_GROUP: wodana-intelligence, WORKER_CONSUMER_NAME: prod-worker-1, WODANA_RELEASE_ID: "${RELEASE}"}
    command: [python, -m, wodana_intelligence.worker]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 320m
    logging: *logging
    depends_on:
      business-core: {condition: service_healthy}
    # The worker touches its own heartbeat file every timer pass; stale for two minutes means it has stopped.
    healthcheck:
      test: [CMD, python, -m, wodana_intelligence.worker.healthcheck]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  web:
    image: wodana-web:${RELEASE}
    network_mode: host
    env_file: [./web.env]
    environment: {NODE_ENV: production, NODE_OPTIONS: --max-old-space-size=640, HOSTNAME: 127.0.0.1, PORT: "3000"}
    init: true
    restart: unless-stopped
    mem_limit: 896m
    logging: *logging
    depends_on:
      business-core: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_period: 30s
      retries: 8
volumes:
  postgres_data: {name: wodana-prod-postgres18}
  redis_data: {name: wodana-prod-redis}
  object_data: {name: wodana-prod-objects}
