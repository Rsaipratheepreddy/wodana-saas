<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Palm Living demo — living room oak media wall coordination</title>
  <desc id="desc">Not-to-scale technical diagram showing oak veneer cladding, MR plywood substrate, concealed LED, media unit, cable route, and a 6 millimetre shadow gap. Site dimensions and outlet positions require verification.</desc>
  <defs>
    <style>
      .bg{fill:#f8f7f3}.paper{fill:#fff}.ink{fill:#171717}.muted{fill:#5b5b58}.line{stroke:#252525;stroke-width:3;fill:none}.fine{stroke:#777771;stroke-width:1.5;fill:none}.dash{stroke:#4f4f4b;stroke-width:2;stroke-dasharray:8 8;fill:none}.warm{fill:#ddd6ca}.oak{fill:#b6a28b}.soft{fill:#efede8}.led{stroke:#d2a967;stroke-width:7;stroke-linecap:round}.label{font:600 24px Arial,sans-serif;fill:#171717}.note{font:20px Arial,sans-serif;fill:#4b4b48}.small{font:17px Arial,sans-serif;fill:#5b5b58}.head{font:700 42px Arial,sans-serif;fill:#171717}.caps{font:700 17px Arial,sans-serif;letter-spacing:3px;fill:#5b5b58}
    </style>
  </defs>
