# Shared routing for every Wodana host (included by wodana.conf); release header set by deploy.sh.
client_max_body_size 50M;
gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
add_header X-Wodana-Release $wodana_release always;

location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

location ^~ /api/v1/integrations/ {
    proxy_pass http://127.0.0.1:8001;
    include /etc/nginx/snippets/wodana-proxy.conf;
}

location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:8000;
    include /etc/nginx/snippets/wodana-proxy.conf;
}

location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Wodana-Release $wodana_release always;
}

# internal.<domain> opens the internal portal.
location = / {
    if ($host ~* ^internal\.) { return 302 /internal; }
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Wodana-Release $wodana_release always;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/wodana-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Wodana-Release $wodana_release always;
}
