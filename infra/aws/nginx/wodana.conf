# Wodana production. deploy.sh writes /etc/nginx/conf.d/wodana-release.conf (the $wodana_release map)
# and switches between the HTTP-only server (before certificates) and HTTPS (after certbot).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Abuse limits per client address. nginx is the edge, so $binary_remote_addr is the real client; requests that
# map to "" are not counted. Sign-in, password reset, MFA, invitation activation and portal codes (web routes and
# the API the mobile app calls): a person needs a few a minute, and an office behind one address gets the burst.
map "$request_method $uri" $wodana_credential_client {
    default "";
    "~^POST /api/v1/auth/(login|password/|mfa/|invitations/activate|organization/resolve|platform/(login|mfa/))" $binary_remote_addr;
    "~^POST /api/auth/(login|forgot-password|reset-password|mfa/|invitations/activate)" $binary_remote_addr;
    "~^POST /api/internal/auth/" $binary_remote_addr;
    "~^POST /api/(v1/)?client-portal/[^/]+/(challenge|login)$" $binary_remote_addr;
    "~^POST /api/v1/mcp/oauth/(register|token)$" $binary_remote_addr;
    "~^POST /api/(v1/)?esign/[^/]+/sign$" $binary_remote_addr;
}
# Public forms anyone can post (website enquiries, lead forms, bookings).
map "$request_method $uri" $wodana_public_form_client {
    default "";
    "~^POST /api/(v1/public/sales/enquiries|sales/enquiries)$" $binary_remote_addr;
    "~^POST /api/(v1/public/crm/lead-forms|enquiry-forms)/" $binary_remote_addr;
    "~^POST /api/(v1/public/booking|book)/" $binary_remote_addr;
    "~^POST /api/(v1/public/gallery|public-gallery)/[^/]+/enquiries$" $binary_remote_addr;
}
limit_req_zone $wodana_credential_client zone=wodana_credentials:10m rate=10r/m;
limit_req_zone $wodana_public_form_client zone=wodana_public_forms:10m rate=20r/m;

server {
    listen 80 default_server;
    server_name wodana.ai *.wodana.ai _;
    server_tokens off;
    # __HTTP_MODE__ is replaced by deploy.sh: "include" serves the app over HTTP until a certificate exists,
    # "redirect" sends everything but ACME to HTTPS.
    include /etc/nginx/snippets/wodana-http-__HTTP_MODE__.conf;
}

# __TLS_BEGIN__
server {
    # nginx 1.24 (Ubuntu 24.04) has no "http2 on;" directive: HTTP/2 is a listen parameter there.
    listen 443 ssl http2 default_server;
    server_name wodana.ai *.wodana.ai _;
    ssl_certificate /etc/letsencrypt/live/wodana-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wodana-prod/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wodana_ssl:10m;
    server_tokens off;
    # For nginx's own responses; the web (next.config.ts) and the API (helmet) send their full security headers.
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/wodana-routes.conf;
}
# __TLS_END__
