<meta charset="utf-8">
<title>Main Portal Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="flow.css">
<style>
/* Layout: the staff app as a window. Sidebar (seats decide what shows) · one page header with one primary action · toolbar · content. Same engine as the concept page. */
html,body{height:100%}
body{margin:0;background:var(--surface-3);color:var(--fg);font-family:var(--f-sans);font-size:var(--t-base);line-height:1.5;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
p{margin:0} h1,h2,h3{margin:0}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--t-xs);color:var(--fg-2);padding:0 4px 8px}
.banner b{color:var(--fg)}
.banner kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line-strong);border-radius:5px;padding:0 5px;background:var(--surface)}
.banner a{color:var(--accent);margin-inline-start:auto}
.app{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--bg);border:1px solid var(--line-strong);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.sb{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sb-top{padding:14px 14px 8px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--ink);display:inline-block}
.brand span{font-size:var(--t-xs);color:var(--fg-3);font-weight:500;display:block}
.find{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 10px;color:var(--fg-3);font-size:var(--t-sm);cursor:pointer;text-align:start}
.find kbd{margin-inline-start:auto;font-family:var(--f-mono);font-size:10px;border:1px solid var(--line-strong);border-radius:5px;padding:0 4px}
.nav{flex:1;overflow-y:auto;padding:4px 8px 8px}
.ng{margin-top:12px}
.ng h5{margin:0 0 4px;padding-inline:8px;font-size:10.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:500}
.ni{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:var(--t-sm);cursor:pointer;color:var(--fg-2);text-align:start}
.ni:hover{background:var(--surface-2);color:var(--fg)}
.ni[aria-current="page"]{background:var(--accent-subtle);color:var(--fg);font-weight:650}
.ni svg{width:16px;height:16px;flex:none;stroke:currentColor}
.ni .bd{margin-inline-start:auto;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--fg-2);border-radius:999px;padding:0 7px}
.ni .bd.hot{background:var(--ink);color:var(--ink-fg)}
.sb-foot{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.sb-foot label{font-size:10.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.sb-foot select{width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:var(--t-sm)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.mtop{display:none;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:17px;height:17px;stroke:var(--fg-2)}
.view{flex:1;min-height:0;overflow:auto;padding:20px 24px 40px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-size:1.45rem;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.ph .sub{font-size:var(--t-sm);color:var(--fg-2)}
.ph .acts{display:flex;gap:8px;align-items:center}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tb .end{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;font-size:var(--t-sm);color:var(--fg-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--ink)}
.tabs .n{font-size:10.5px;color:var(--fg-3);margin-inline-start:4px}
.brief{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 14px;background:var(--ai-subtle);font-size:var(--t-sm);margin-bottom:16px}
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.sec{display:grid;gap:8px;margin-bottom:18px}
.sec > h4{margin:0;font-size:var(--t-xs);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:500}
.qi{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:start;width:100%}
.qi:hover{border-color:var(--line-strong)}
.qi .tx{display:grid;gap:3px;min-width:0;flex:1}
.qi .tx b{font-size:var(--t-sm)}
.qi .tx .w{font-size:var(--t-xs);color:var(--fg-2)}
.qi .tx .chips{margin-top:2px}
.qi .btn{flex:none}
.wi{display:flex;gap:10px;align-items:center;font-size:var(--t-sm);padding:8px 2px;border-bottom:1px solid var(--line)}
.wi:last-child{border-bottom:0}
.wi .since{margin-inline-start:auto;font-size:var(--t-xs);color:var(--fg-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.ev{display:flex;gap:10px;font-size:var(--t-sm);align-items:baseline}
.ev .t{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--fg-3);width:42px;flex:none}
.grid{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--surface)}
.grid table{border-collapse:collapse;width:100%;font-size:var(--t-sm);min-width:640px}
.grid th{position:sticky;top:0;background:var(--surface);text-align:start;font-weight:500;color:var(--fg-3);font-size:var(--t-xs);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid td.num{text-align:end;font-variant-numeric:tabular-nums}
.grid th.num{text-align:end}
.rn{display:grid;line-height:1.3}
.rn span{font-size:var(--t-xs);color:var(--fg-3)}
.trk{display:flex;gap:3px;min-width:150px}
.trk i{flex:1;height:6px;border-radius:3px;background:var(--surface-3)}
.trk i.done{background:var(--done)} .trk i.now{background:var(--accent)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.col h5{margin:0;font-size:var(--t-xs);display:flex;justify-content:space-between;color:var(--fg-2)}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;cursor:pointer;font-size:var(--t-sm)}
.bc .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 270px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);min-height:520px}
.thl{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.thl .tabs{margin:0;padding-inline:6px}
.th{display:grid;gap:3px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start;background:transparent;border-inline:0;border-top:0;width:100%}
.th[aria-current="true"]{background:var(--accent-subtle)}
.th .r1{display:flex;gap:6px;align-items:center;font-size:var(--t-sm)}
.th .r1 .tm{margin-inline-start:auto;font-size:var(--t-xs);color:var(--fg-3)}
.th .pv{font-size:var(--t-xs);color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.conv{display:flex;flex-direction:column;min-width:0}
.conv .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msgs{flex:1;padding:14px;display:grid;gap:10px;align-content:start;background:var(--bg)}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:var(--t-sm);background:var(--surface);border:1px solid var(--line)}
.msg.me{justify-self:end;background:var(--accent-subtle);border-color:transparent}
.msg.note{justify-self:center;background:var(--wait-subtle);border-color:transparent;color:var(--wait);font-size:var(--t-xs)}
.msg .meta{font-size:10.5px;color:var(--fg-3);margin-top:3px}
.compose{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.compose .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--wait-subtle);color:var(--wait);border-radius:10px;padding:8px 10px;font-size:var(--t-sm)}
.ctxp{border-inline-start:1px solid var(--line);padding:14px;display:grid;gap:14px;align-content:start}
.ctxp h4{margin:0 0 6px;font-size:var(--t-xs);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:var(--t-xs)}
.kv span:nth-child(odd){color:var(--fg-3)}
.cal{display:grid;grid-template-columns:150px repeat(7,minmax(110px,1fr));border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--surface)}
.cal > div{border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);padding:6px;min-height:64px;font-size:var(--t-xs)}
.cal .hd{min-height:auto;font-weight:600;color:var(--fg-2);background:var(--surface-2)}
.cal .rl{font-weight:600;color:var(--fg-2)}
.cal .we{background:var(--surface-2)}
.evt{border-radius:7px;padding:4px 6px;margin-bottom:4px;line-height:1.3;border-inline-start:3px solid var(--accent);background:var(--accent-subtle)}
.evt.cl{border-color:var(--client);background:var(--client-subtle)}
.evt.op{border-color:var(--wait);background:var(--wait-subtle)}
.evt.vi{border-color:var(--done);background:var(--done-subtle)}
.apv{display:grid;gap:10px}
.ap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.ap .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ap .top .amt{margin-inline-start:auto;font-weight:700;font-variant-numeric:tabular-nums}
.ap .checks{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:var(--t-xs)}
.ap .checks span{display:inline-flex;gap:5px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.tile b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.tile span{font-size:var(--t-xs);color:var(--fg-2)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:var(--t-xs)}
.bar i{height:8px;border-radius:4px;background:var(--accent);display:block}
.bar .bg{background:var(--surface-2);border-radius:4px}
.jobhd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.jobhd .acts{margin-inline-start:auto;display:flex;gap:8px}
.scrim{position:absolute;inset:0;background:rgba(10,14,16,.35);z-index:40}
.sheet{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .sh b{font-size:var(--t-md)}
.sheet .sh button{margin-inline-start:auto}
.sheet .sbd{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.sheet.wide{width:min(380px,100%);background:var(--bg)}
.setrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:var(--t-sm);padding:8px 0;border-bottom:1px solid var(--line)}
.setrow .src{font-size:var(--t-xs);color:var(--fg-3)}
.setrow .ov{color:var(--accent);font-weight:700}
.pal{position:fixed;inset:0;z-index:70;background:rgba(10,14,16,.35);display:grid;place-items:start center;padding:12vh 16px 16px}
.pal-in{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal-in input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:var(--t-md);background:transparent;outline:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-g{font-size:10.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);padding:8px 10px 4px}
.pal-i{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:var(--t-sm);text-align:start}
.pal-i[aria-selected="true"]{background:var(--accent-subtle)}
.pal-i .hint{margin-inline-start:auto;font-size:var(--t-xs);color:var(--fg-3)}
.tabbar{display:none}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 10px;display:grid;gap:6px;place-items:center;font-size:var(--t-sm);cursor:pointer}
.cap svg{width:22px;height:22px;stroke:var(--fg-2)}
@media (max-width:1100px){ .inbox{grid-template-columns:260px minmax(0,1fr)} .ctxp{display:none} .home{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  body{padding-block:6px 8px}
  .banner{display:none}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;border-radius:14px}
  .sb{position:absolute;inset-block:0;inset-inline-start:0;width:min(280px,86%);z-index:50;transform:translateX(-105%);transition:transform .2s}
  .app.open .sb{transform:none}
  .mtop{display:flex}
  .view{padding:14px 14px 30px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{border:0;background:transparent;display:grid;place-items:center;gap:2px;padding:7px 0;font-size:10.5px;color:var(--fg-3);cursor:pointer}
  .tabbar button svg{width:19px;height:19px;stroke:currentColor}
  .tabbar button[aria-current="page"]{color:var(--fg);font-weight:700}
  .inbox{grid-template-columns:minmax(0,1fr)} .conv{display:none} .inbox.reading .thl{display:none} .inbox.reading .conv{display:flex}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.sb{transition:none}}
</style>

<div class="banner"><b>Main portal</b><span>Clickable prototype on the same engine as the concept page.</span><span>Switch seat at the bottom of the sidebar · <kbd>⌘K</kbd> to find or ask</span><a id="concept-link" href="index.html">Open the concept</a></div>
<div class="app" id="app">
  <aside class="sb" id="sb" aria-label="Navigation">
    <div class="sb-top">
      <div class="brand"><i></i><div>Firm A<span>Interiors workspace</span></div></div>
      <button class="find" type="button" data-go="palette"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>Find or ask<kbd>⌘K</kbd></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot"><label for="seat">Viewing as</label><select id="seat">
      <option value="owner">Owner · CRM owner</option><option value="sa">Sales admin</option><option value="am" selected>Account manager</option><option value="des">Interior designer</option><option value="fin">Finance</option><option value="ops">Operations</option>
    </select></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main">
    <div class="mtop"><button class="iconbtn" type="button" data-go="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="find" type="button" data-go="palette">Find or ask</button></div>
    <div class="view" id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
</div>
<div class="sheet" id="sheet" hidden><div class="sh"><b id="sheet-t"></b><button class="btn ghost sm" type="button" data-go="close-sheet">Close</button></div><div class="sbd" id="sheet-b"></div></div>
<div class="sheet wide" id="cv" hidden><div class="sh"><b>Client view</b><button class="btn ghost sm" type="button" data-go="close-cv">Close</button></div><div class="sbd" id="cv-b"></div></div>
<div class="pal" id="pal" hidden><div class="pal-in" role="dialog" aria-label="Find or ask"><input id="pal-q" type="text" placeholder="Find a job, page or person, or say what to do" autocomplete="off"><div class="pal-list" id="pal-list"></div></div></div>

<script src="flow.js"></script>
<script>
(function(){
  const F = window.Flow, esc = F.esc, val = F.val, money = F.money;
  const I = d => '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  const ICON = {
    home:I('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
    inbox:I('<path d="M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/>'),
    queue:I('<path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="17" r="3"/>'),
    route:I('<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/>'),
    cal:I('<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>'),
    check:I('<path d="M4 12l5 5L20 6"/>'),
    pen:I('<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>'),
    ruler:I('<path d="M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/>'),
    factory:I('<path d="M3 21V10l6 4V10l6 4V6h6v15z"/>'),
    truck:I('<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'),
    money:I('<path d="M3 6h18v12H3z"/><circle cx="12" cy="12" r="3"/>'),
    chart:I('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
    users:I('<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1M16 4a4 4 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.6"/>'),
    grid:I('<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>'),

  let palItems = [], palSel = 0;
  function palData(q){
    const out = [];
    const ql = q.trim().toLowerCase();
    if (ql.split(/\s+/).length >= 3) out.push(['Ask', 'Plan it: “' + q.trim() + '”', 'AI turns it into steps on the right job', 'plan']);
    const acts = {am:[['Log contact on JOB-0146','job:JOB-0146'],['Book the intro for JOB-0151','job:JOB-0151']], sa:[['Send proposal 1 for JOB-0144','job:JOB-0144'],['Reply to new chats','inbox']], des:[['Open material selection · JOB-0142','job:JOB-0142']], fin:[['Verify the JOB-0147 payment','job:JOB-0147']], ops:[['Review the JOB-0131 delay','job:JOB-0131']], owner:[['Approve deal 1 · JOB-0147','approvals']]}[st.seat];
    acts.forEach(a => out.push(['Do', a[0], 'Prepared by AI', a[1]]));
    JOBS.forEach(j => out.push(['Jobs', j.id + ' · ' + j.name, val(j.step.name, j.c), 'job:' + j.id]));
    NAV.forEach(g => g.items.forEach(i => { if (allowed(i[0])) out.push(['Go to', i[1], '', i[0]]); }));
    return ql ? out.filter(o => o[0] === 'Ask' || (o[1] + ' ' + o[2]).toLowerCase().includes(ql)) : out.slice(0, 14);
  }
  function renderPal(){
    palItems = palData($('pal-q').value); if (palSel >= palItems.length) palSel = 0;
    let g = ''; $('pal-list').innerHTML = palItems.map((o, k) => { const head = o[0] !== g ? '<div class="pal-g">' + (g = o[0]) + '</div>' : ''; return head + '<button class="pal-i" type="button" data-pal="' + k + '" aria-selected="' + (k === palSel) + '">' + (o[0] === 'Ask' || o[0] === 'Do' ? SPARK : '') + '<span>' + esc(o[1]) + '</span><span class="hint">' + esc(o[2]) + '</span></button>'; }).join('') || '<div class="pal-g">Nothing found</div>';
  }
  function openPal(){ $('pal').hidden = false; $('pal-q').value = ''; palSel = 0; renderPal(); setTimeout(() => $('pal-q').focus(), 0); }
  function closePal(){ $('pal').hidden = true; }
  function runPal(k){ const o = palItems[k]; if (!o) return; closePal(); if (o[3] === 'plan') { go('job:JOB-0142'); setTimeout(() => { const f = document.querySelector('#jobmap form'); if (f) { f.querySelector('input').value = $('pal-q').value; f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event('submit', {cancelable:true})); } }, 50); } else go(o[3]); }

  /* ---------- routing ---------- */
  function go(r, el){
    if (r === 'palette') return openPal();
    if (r === 'menu') { $('app').classList.toggle('open'); $('scrim').hidden = !$('app').classList.contains('open'); return; }
    if (r === 'capture') return openSheet('Capture', '<div class="cap"><button type="button" data-go="toast" data-msg="Photo saved offline · uploads first when back online">' + ICON.camera + 'Photo</button><button type="button" data-go="toast" data-msg="Voice note → AI drafts the answers">' + ICON.mic + 'Voice note</button><button type="button" data-go="toast" data-msg="Measurement added to the site measure">' + ICON.ruler + 'Measure</button><button type="button" data-go="toast" data-msg="Proof attached → Finance check">' + ICON.receipt + 'Payment proof</button></div><p class="xs muted">Attaches to JOB-0150 · you are at its site.</p>');
    if (r === 'toast') return F.toast(el && el.dataset.msg ? el.dataset.msg : 'Prototype');
    if (r === 'close-sheet') { $('sheet').hidden = true; return; }
    if (r === 'close-cv') { $('cv').hidden = true; return; }
    if (r === 'client-view') { $('cv').hidden = false; return; }
    if (r === 'settings-sheet') return openSettingsSheet(el.dataset.mod);
    if (r === 'inbox-tab') { st.inboxTab = el.dataset.v; st.reading = false; return render(); }
    if (r === 'thread') { st.thread = Number(el.dataset.i); st.t3 = false; st.reading = true; return render(); }
    if (r === 'inbox-back') { st.reading = false; return render(); }
    if (r === 't3') { st.t3 = true; return render(); }
    if (r === 't3-cancel') { st.t3 = false; return render(); }
    if (r === 't3-ok') { st.t3 = false; THREADS[st.thread].label = 'Resolved'; F.toast('T3 sent · chat resolved'); return render(); }
    if (r === 'enq-tab') { st.enqTab = el.dataset.v; return render(); }
    if (r === 'jobs-view') { st.jobsView = el.dataset.v; return render(); }
    if (r === 'job-tab') return switchJobTab(el.dataset.v);
    if (r === 'cal-t') { st.cal[el.dataset.v] = !st.cal[el.dataset.v]; return render(); }
    if (r === 'approve') { st.approved.add(el.dataset.v); F.toast(el.dataset.ret ? 'Returned with a reason · the submitter is told' : 'Approved · recorded with your name and time'); return render(); }
    if (r === 'stmt') return openSheet('Client statement', '<div class="card"><div class="j-mrow"><div class="top"><span>Proposal 1 · design fee</span><span class="amt">' + money(48000) + '</span></div><span>' + chip('Paid 14 Oct', 'done') + '</span></div><div class="j-mrow"><div class="top"><span>Proposal 2 · estimate · 3 stages</span><span class="amt">' + money(386500) + '</span></div><span>' + chip('After design approval') + '</span></div></div><p class="xs muted">Separate invoices and receipts, one statement. Duplicates never create a second client.</p>');
    if (r.startsWith('job:')) { st.route = 'job'; st.jobId = r.slice(4); st.jobTab = 'map'; }
    else if (allowed(r)) st.route = r;
    else { F.toast('This seat can’t open ' + r + ' · switch seat to see it'); return; }
    $('app').classList.remove('open'); $('scrim').hidden = true; $('sheet').hidden = true; $('cv').hidden = true;
    try { history.replaceState(null, '', '#' + (st.route === 'job' ? st.jobId : st.route)); } catch (e) {}
    render(); view.scrollTop = 0;
  }
  function render(){
    if (!allowed(st.route)) st.route = 'home';
    renderNav();
    const r = st.route;
    if (r === 'home') renderHome(); else if (r === 'inbox') renderInbox(); else if (r === 'enquiries') renderEnquiries(); else if (r === 'jobs') renderJobs(); else if (r === 'job') renderJob();
    else if (r === 'calendar') renderCalendar(); else if (r === 'approvals') renderApprovals(); else if (r === 'reports') renderReports(); else if (r === 'settings') renderSettings(); else if (WB[r]) renderWB(r); else renderHome();
  }

  document.addEventListener('click', e => {
    const p = e.target.closest('[data-pal]'); if (p) { runPal(Number(p.dataset.pal)); return; }
    if (e.target.id === 'pal') { closePal(); return; }
    if (e.target.id === 'scrim') { go('menu'); return; }
    const g = e.target.closest('[data-go]'); if (g && !e.target.closest('#jobmap .j-room [data-a]')) { e.preventDefault(); go(g.dataset.go, g); }
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('pal').hidden ? openPal() : closePal(); return; }
    if ($('pal').hidden) { if (e.key === 'Escape') { $('sheet').hidden = true; $('cv').hidden = true; } return; }
    if (e.key === 'Escape') closePal();
    else if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palItems.length - 1); renderPal(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); renderPal(); e.preventDefault(); }
    else if (e.key === 'Enter') { runPal(palSel); e.preventDefault(); }
  });
  $('pal-q').addEventListener('input', () => { palSel = 0; renderPal(); });
  $('seat').value = st.seat;
  $('seat').addEventListener('change', e => { st.seat = e.target.value; try { localStorage.setItem('mp-seat', st.seat); } catch (x) {} if (!allowed(st.route)) st.route = 'home'; render(); F.toast('Viewing as ' + SEATS[st.seat].label + ' · the sidebar and My day follow the seat'); });
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (!h) return; if (job(h.toUpperCase())) { if (st.route !== 'job' || st.jobId !== h.toUpperCase()) go('job:' + h.toUpperCase()); } else if (h !== st.route) go(h); });
  F.ensureDefs();
  render();
})();
</script>
